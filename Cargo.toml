[package]
name = "fbm"
version = "0.1.0"
edition = "2021"
description = "Local-first Facebook Messenger archive CLI backed by ws3-fca and SQLite/libSQL."
license = "MIT"
repository = "https://github.com/Zpankz/fbm"
readme = "README.md"
keywords = ["messenger", "archive", "sqlite", "cli", "libsql"]
categories = ["command-line-utilities", "database"]
rust-version = "1.78"
exclude = [
  "target/**",
  "node_modules/**",
  "*.db",
  "*.db-*",
  "*.sqlite",
  "*.sqlite3",
  "appstate*.json",
  "browser-appstate*.json",
  ".env*"
]

[dependencies]
libsql = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["fs", "io-util", "macros", "process", "rt-multi-thread"] }
toml = "0.8"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"

